[project]
name = "dirac-lang-py"
version = "0.1.0"
description = "Python implementation of the DIRAC language runtime (port of the Node.js reference implementation)"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
dirac-py = "dirac.cli:main"
dirac-py-shell = "dirac.shell:run"
paul = "dirac.cli:main"
pash = "dirac.shell:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dirac*"]
