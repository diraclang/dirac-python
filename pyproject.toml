[project]
name = "diraclang"
version = "0.1.1"
description = "Python implementation of the DIRAC language runtime (port of the Node.js reference implementation)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
	"PyYAML>=6.0",
]

[project.scripts]
dirac = "dirac.cli:main"
dirac-py = "dirac.cli:main"
dirac-py-shell = "dirac.shell:run"
paul = "dirac.shell:run"
pash = "dirac.shell:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dirac*"]

[tool.setuptools.package-data]
dirac = ["lib/*.di", "lib/*.yml"]
